# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: c700897f-d15f-446d-8fe3-44439dfebc87

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
   # mode: development
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-a4e7f3b4-dfcf.cloud.databricks.com
    variables:
      catalog: dev_bakehouse
      schema: rnd
  prod:
    presets:
      name_prefix: prod_
    mode: production
    workspace:
      host: https://dbc-a4e7f3b4-dfcf.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/vinayshetty7899@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vinayshetty7899@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_bakehouse
      schema: rnd
    permissions:
      - user_name: vinayshetty7899@gmail.com
        level: CAN_MANAGE
